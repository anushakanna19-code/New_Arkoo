# ── Docker Compose: Development ─────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/config:/app/backend/config
    environment:
      - NODE_ENV=production
    restart: unless-stopped
